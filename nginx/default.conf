limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    # Serve the compiled React frontend.
    root /usr/share/nginx/html;
    index index.html;

    # Send API requests to the backend container.
    location /api/ {
        limit_req zone=api_limit burst=4 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Return index.html so frontend routes work after a page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 12 always;
        return 429 '{"error":"Rate limit exceeded.","retryAfterSeconds":12}';
    }
}